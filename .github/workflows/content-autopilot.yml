name: Content Autopilot

# Zero-touch pipeline: backpressure -> curate (LLM) -> produce (LLM) -> build gate
# -> publish -> distribute. Throttled by Buffer queue depth. See
# docs/superpowers/specs for design. Credentials come from repo secrets
# (mirrored from the waaseyaa-infra Ansible vault).

on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC (9 AM ET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Produce + gate only; skip publish and Buffer distribute'
        required: false
        default: 'false'
      force:
        description: 'Bypass the Buffer backpressure gate'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: content-autopilot
  cancel-in-progress: false

env:
  QUEUE_REPO: jonesrussell/jonesrussell
  BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
  BUFFER_CHANNEL_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_FACEBOOK }}
  BUFFER_CHANNEL_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_LINKEDIN }}
  BUFFER_CHANNEL_BLUESKY: ${{ secrets.BUFFER_CHANNEL_BLUESKY }}

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      # 1) BACKPRESSURE — stop if the Buffer queue is full
      - name: Buffer backpressure gate
        id: gate
        run: |
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if node scripts/buffer-queue-depth.mjs 9; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Buffer queue full — nothing to do this run."
          fi

      # 2) CANDIDATES — pull open mined issues from the queue repo
      - name: Gather mined candidates
        id: candidates
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh issue list --repo "$QUEUE_REPO" \
            --label "content-queue" --label "stage:mined" --state open \
            --json number,title,body,url --limit 40 > candidates.json
          n=$(jq length candidates.json)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n mined candidates."

      # 3) CURATE + PRODUCE — Claude picks the most useful item and writes it
      - name: Produce post with Claude
        id: produce
        if: steps.gate.outputs.proceed == 'true' && steps.candidates.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 50
            --allowedTools Edit,Read,Write,Bash,Glob,Grep
          prompt: |
            You are the content autopilot for this Hugo blog. Work fully autonomously; no human will review before publish.

            INPUTS
            - `candidates.json` (repo root): open mined content-queue issues {number,title,body,url} from ${{ env.QUEUE_REPO }}.
            - Voice/structure: read `docs/blog-style.md` and the reference post `content/posts/laravel/laravel-boost-ddev/index.md`.
            - Conventions and gotchas: read `CLAUDE.md` (frontmatter, Ahnii/Baamaapii, relref rules, page-bundle layout under content/posts/<category>/<slug>/index.md).

            STEP 1 — CURATE (be ruthless). Pick AT MOST ONE candidate that would make a genuinely useful, self-contained post a reader would value. Reject thin per-directory dev-scaffolding items (e.g. "packages/field work"). If NOTHING clears that bar, write `{"status":"NONE","reason":"..."}` to `autopilot-result.json` and STOP.

            STEP 2 — VERIFY. If the post would contain code, config, or interface signatures, verify each against the real source repo using `gh api repos/<owner>/<repo>/contents/<path>` (GH_TOKEN is set). If you cannot verify a snippet, DO NOT invent it — either write the post without it or, if the post depends on it, write `{"status":"HOLD","issue":N,"reason":"unverifiable code"}` to `autopilot-result.json` and STOP.

            STEP 3 — PRODUCE. Write the Hugo post to `content/posts/<category>/<slug>/index.md` as a page bundle, frontmatter with `draft: false`, sentence-case title, summary, max 4 tags, correct date (today). Follow the blog voice exactly (open "Ahnii!", close "Baamaapii"). Then write companion social copy to `docs/social/<slug>.md` with exactly three sections: `## Bluesky`, `## LinkedIn`, `## Facebook`, following these rules: plain text only (no markdown/emoji/em-dashes); Bluesky body+URL under 300 chars; put the canonical blog URL (https://jonesrussell.github.io/blog/<slug>/) in each body; Facebook 1-2 hashtags, LinkedIn 3-5, Bluesky 1-2.

            STEP 4 — RESULT. Write `autopilot-result.json` with:
            `{"status":"PUBLISH","issue":<number>,"slug":"<slug>","post_path":"content/posts/<category>/<slug>/index.md","social_path":"docs/social/<slug>.md"}`

            Do not commit anything. Do not run git. Just leave files on disk and write autopilot-result.json.

      # 4) Parse Claude's result
      - name: Read produce result
        id: result
        if: steps.produce.outcome == 'success'
        run: |
          if [[ ! -f autopilot-result.json ]]; then
            echo "status=ERROR" >> "$GITHUB_OUTPUT"; echo "No result file."; exit 0
          fi
          cat autopilot-result.json
          for k in status issue slug post_path social_path; do
            echo "$k=$(jq -r --arg k "$k" '.[$k] // ""' autopilot-result.json)" >> "$GITHUB_OUTPUT"
          done

      # 5) BUILD GATE — Hugo must build the produced post
      - name: Build gate
        if: steps.result.outputs.status == 'PUBLISH'
        run: hugo --gc --minify

      # 6) PUBLISH — commit the post + social copy, push (triggers deploy)
      - name: Publish
        if: steps.result.outputs.status == 'PUBLISH' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "content-autopilot[bot]"
          git config user.email "noreply@anthropic.com"
          git add "${{ steps.result.outputs.post_path }}" "${{ steps.result.outputs.social_path }}"
          git commit -m "content: autopilot publish ${{ steps.result.outputs.slug }} (queue #${{ steps.result.outputs.issue }})"
          git pull --rebase origin main
          git push origin main

      # 7) DISTRIBUTE — queue social copy to Buffer
      - name: Distribute to Buffer
        if: steps.result.outputs.status == 'PUBLISH' && github.event.inputs.dry_run != 'true'
        run: node scripts/buffer-distribute.mjs "${{ steps.result.outputs.social_path }}" addToQueue

      # 8) Close the queue issue as distributed
      - name: Close queue issue
        if: steps.result.outputs.status == 'PUBLISH' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh issue edit "${{ steps.result.outputs.issue }}" --repo "$QUEUE_REPO" \
            --remove-label "stage:mined" --add-label "stage:distributed" || true
          gh issue close "${{ steps.result.outputs.issue }}" --repo "$QUEUE_REPO" --reason completed || true

      - name: Summary
        if: always()
        run: |
          echo "gate.proceed=${{ steps.gate.outputs.proceed }}"
          echo "candidates=${{ steps.candidates.outputs.count }}"
          echo "result.status=${{ steps.result.outputs.status }}"
          echo "dry_run=${{ github.event.inputs.dry_run }}"
