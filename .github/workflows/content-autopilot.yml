name: Content Preflight
run-name: Content preflight ${{ inputs.request_id }}

# Generation runs in the local Codex schedule. This workflow only reads state.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique local run identifier for matching the result'
        required: true

permissions:
  contents: read

concurrency:
  group: content-autopilot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read queue capacity and candidates
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_FACEBOOK }}
          BUFFER_CHANNEL_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_LINKEDIN }}
          BUFFER_CHANNEL_BLUESKY: ${{ secrets.BUFFER_CHANNEL_BLUESKY }}
        run: node scripts/content-preflight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: content-preflight-${{ github.run_id }}
          path: content-preflight.json
          if-no-files-found: error
          retention-days: 7
