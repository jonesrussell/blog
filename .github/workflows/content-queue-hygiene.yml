name: Content Queue Hygiene

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Close stale mined issues (false previews only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: content-queue-hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find stale mined content
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [[ "$APPLY" == 'true' ]]; then
            node scripts/content-queue-hygiene.mjs --apply
          else
            node scripts/content-queue-hygiene.mjs
          fi
